<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>임신 주수 계산기</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic",sans-serif;background:#fff7fa;color:#30313a;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid #f0d9e3;border-radius:24px;padding:34px;box-shadow:0 16px 45px rgba(142,67,99,.12)}.icon{font-size:34px}h1{margin:8px 0 5px;color:#9b466d;font-size:30px}.sub{color:#75636b;margin:0 0 26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-weight:700;color:#604653}input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #dbc6cf;border-radius:12px;font:inherit;background:#fff}input:focus{outline:3px solid #f8ddeb;border-color:#c97098}.actions{display:flex;gap:10px;margin-top:22px}button{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#b65782;color:#fff;flex:1}.secondary{background:#f5e6ed;color:#7d4560}.result{display:none;margin-top:25px;background:linear-gradient(135deg,#fff3f8,#f4f0ff);border:1px solid #ecd4df;border-radius:18px;padding:22px}.result.show{display:block}.result h2{font-size:17px;margin:0 0 14px;color:#8e3f63}.big{font-size:28px;font-weight:900;color:#a1446e;margin:4px 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.detail{background:#fff;padding:13px;border-radius:12px;border:1px solid #eadde3}.detail span{display:block;font-size:12px;color:#87717a}.detail strong{display:block;margin-top:4px}.notice{font-size:12px;color:#7d6c73;margin:20px 0 0;padding-top:16px;border-top:1px solid #eee}.error{display:none;color:#b42318;background:#fff0ee;padding:11px;border-radius:10px;margin-top:14px}.error.show{display:block}@media(max-width:560px){.card{padding:23px}.grid,.details{grid-template-columns:1fr}h1{font-size:25px}.actions{flex-direction:column}}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">👶🏻</div>
    <h1>임신 주수 계산기</h1>
    <p class="sub">마지막 생리 시작일을 기준으로 현재 임신 주수와 출산예정일을 계산합니다.</p>
    <form id="calculator">
      <div class="grid">
        <label>마지막 생리 시작일<input id="lastPeriod" type="date" required></label>
        <label>계산 기준일<input id="baseDate" type="date" required></label>
      </div>
      <div id="error" class="error" role="alert"></div>
      <div class="actions"><button class="primary" type="submit">임신 주수 계산하기</button><button class="secondary" type="reset">초기화</button></div>
    </form>
    <section id="result" class="result" aria-live="polite">
      <h2>계산 결과</h2>
      <p id="pregnancyWeek" class="big"></p>
      <div class="details">
        <div class="detail"><span>임신 경과일</span><strong id="elapsedDays"></strong></div>
        <div class="detail"><span>출산예정일</span><strong id="dueDate"></strong></div>
        <div class="detail"><span>현재 임신 단계</span><strong id="stage"></strong></div>
        <div class="detail"><span>예정일까지</span><strong id="remainingDays"></strong></div>
      </div>
    </section>
    <p class="notice">※ 평균 28일 생리주기와 마지막 생리 시작일을 기준으로 한 예상값입니다. 실제 임신 주수와 출산예정일은 산부인과 초음파검사로 확인해 주세요.</p>
  </main>
  <script>
    const form=document.querySelector('#calculator');
    const lastPeriod=document.querySelector('#lastPeriod');
    const baseDate=document.querySelector('#baseDate');
    const result=document.querySelector('#result');
    const error=document.querySelector('#error');
    const DAY=86400000;
    const toInputDate=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
    const parseDate=value=>{const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d)};
    const formatDate=d=>new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(d);
    const today=new Date();today.setHours(0,0,0,0);baseDate.value=toInputDate(today);
    form.addEventListener('submit',e=>{
      e.preventDefault();error.classList.remove('show');
      const start=parseDate(lastPeriod.value),base=parseDate(baseDate.value);
      const elapsed=Math.round((base-start)/DAY);
      if(elapsed<0){error.textContent='계산 기준일은 마지막 생리 시작일보다 빠를 수 없습니다.';error.classList.add('show');result.classList.remove('show');return;}
      if(elapsed>300){error.textContent='입력한 날짜 차이가 너무 큽니다. 날짜를 다시 확인해 주세요.';error.classList.add('show');result.classList.remove('show');return;}
      const weeks=Math.floor(elapsed/7),days=elapsed%7;
      const due=new Date(start);due.setDate(due.getDate()+280);
      const remain=Math.max(0,Math.round((due-base)/DAY));
      let stage=weeks<14?'임신 초기':weeks<28?'임신 중기':weeks<=42?'임신 후기':'예정일 경과';
      document.querySelector('#pregnancyWeek').textContent=`현재 임신 ${weeks}주 ${days}일`;
      document.querySelector('#elapsedDays').textContent=`${elapsed}일`;
      document.querySelector('#dueDate').textContent=formatDate(due);
      document.querySelector('#stage').textContent=stage;
      document.querySelector('#remainingDays').textContent=remain?`${remain}일`:'예정일 도달 또는 경과';
      result.classList.add('show');
    });
    form.addEventListener('reset',()=>setTimeout(()=>{baseDate.value=toInputDate(today);result.classList.remove('show');error.classList.remove('show')},0));
  </script>
</body>
</html>
